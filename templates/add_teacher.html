<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Teacher - LogHub</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ddd;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #1f1f1f;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }
    header h1 {
      margin: 0;
      font-size: 22px;
      color: #4CAF50;
    }
    .container {
      max-width: 500px;
      margin: 40px auto;
      background: #1e1e1e;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }
    .container h2 {
      margin-bottom: 20px;
      color: #4CAF50;
      text-align: center;
    }
    form label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: #bbb;
    }
    form input, form select {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #252525;
      color: #ddd;
    }
    form input:focus, form select:focus {
      outline: none;
      border-color: #4CAF50;
    }
    .btn {
      display: inline-block;
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .btn:hover {
      background: #45a049;
    }
    .back-link {
      display: block;
      margin-top: 15px;
      text-align: center;
      color: #4CAF50;
      text-decoration: none;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>➕ Add Teacher</h1>
    <div>
      <a href="/teachers" class="btn" style="padding: 8px 15px; background:#333;">⬅ Back</a>
    </div>
  </header>

  <div class="container">
    <h2>Teacher Information</h2>
    <form method="POST">
      <label>Full Name</label>
      <input type="text" name="full_name" required>

      <label>Username</label>
      <input type="text" name="username" required>

      <label>Password</label>
      <input type="password" name="password" required>

      <label>Department</label>
      <select name="department" required>
        <option value="">-- Select Department --</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Electronics">Electronics</option>
        <option value="Mechanical">Mechanical</option>
        <option value="Civil">Civil</option>
        <option value="Mathematics">Mathematics</option>
      </select>

      <button type="submit" class="btn">Save Teacher</button>
    </form>
    <a href="/teachers" class="back-link">⬅ Back to Teachers</a>
  </div>
</body>
</html>
