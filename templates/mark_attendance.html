<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mark Attendance - LogHub</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ddd;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #1f1f1f;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }
    header h1 {
      margin: 0;
      font-size: 22px;
      color: #4CAF50;
    }
    .container {
      max-width: 500px;
      margin: 60px auto;
      background: #1e1e1e;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
      text-align: center;
    }
    h2 {
      color: #4CAF50;
      margin-bottom: 20px;
    }
    .status {
      font-size: 18px;
      margin: 20px 0;
      padding: 15px;
      border-radius: 8px;
      background: #2a2a2a;
      color: #ddd;
    }
    .btn {
      display: inline-block;
      padding: 12px 20px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      margin-top: 20px;
      transition: background 0.3s ease;
    }
    .btn:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <header>
    <h1>✔ Mark Attendance</h1>
    <div>
      <a href="/dashboard" class="btn" style="background:#333;">⬅ Dashboard</a>
    </div>
  </header>

  <div class="container">
    <h2>Attendance Marked Successfully ✅</h2>
    <div class="status">
      <p><b>User:</b> {{ username }}</p>
      <p><b>Date:</b> {{ date }}</p>
      <p><b>Status:</b> Present</p>
    </div>
    <a href="/attendance_history" class="btn">📅 View Attendance History</a>
  </div>
</body>
</html>
