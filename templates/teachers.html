<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teachers - LogHub</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
      background: #1e1e1e;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #4CAF50;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .btn {
      padding: 10px 16px;
      border-radius: 6px;
      text-decoration: none;
      color: white;
      background: #4CAF50;
      transition: 0.3s;
    }
    .btn:hover {
      background: #45a049;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #2a2a2a;
      border-radius: 10px;
      overflow: hidden;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #444;
      text-align: left;
    }
    th {
      background: #333;
    }
    tr:hover {
      background: #3a3a3a;
    }
  </style>
</head>
<body class="dark">
  <div class="container">
    <div class="top-bar">
      <h1>Teachers List</h1>
      <a href="{{ url_for('add_teacher') }}" class="btn">+ Add Teacher</a>
    </div>
    
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Full Name</th>
          <th>Department</th>
        </tr>
      </thead>
      <tbody>
        {% for teacher in teachers %}
        <tr>
          <td>{{ teacher[0] }}</td>
          <td>{{ teacher[1] }}</td>
          <td>{{ teacher[2] if teacher[2] else 'N/A' }}</td>
          <td>{{ teacher[3] if teacher[3] else 'N/A' }}</td>
        </tr>
        {% else %}
        <tr>
          <td colspan="4" style="text-align:center; color: #aaa;">No teachers found</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

    <div style="margin-top: 20px; text-align: center;">
      <a href="{{ url_for('dashboard') }}" class="btn">⬅ Back to Dashboard</a>
    </div>
  </div>
</body>
</html>
