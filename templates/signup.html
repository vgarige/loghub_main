<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - LogHub</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dark">
  <div class="form-container">
    <h2>Create Account</h2>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}
    <form method="POST" action="/signup" onsubmit="return validateForm()">
      <input type="text" name="username" placeholder="Username" required>
      
      <input type="password" id="password" name="password" placeholder="Password" required>
      <small>Password must be at least 8 characters, include an uppercase letter, a number, and a special character.</small>
      
      <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
      
      <div id="error-message" class="flash" style="display:none;"></div>
      <button type="submit">Sign Up</button>
    </form>
    <a href="/login" class="btn">Already have an account? Login</a>
  </div>

  <script>
    function validateForm() {
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm_password").value;
      const errorMessage = document.getElementById("error-message");

      const regex = /^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*]).{8,}$/;

      if (!regex.test(password)) {
        errorMessage.style.display = "block";
        errorMessage.textContent = "Password is too weak!";
        return false;
      }

      if (password !== confirmPassword) {
        errorMessage.style.display = "block";
        errorMessage.textContent = "Passwords do not match!";
        return false;
      }

      errorMessage.style.display = "none";
      return true;
    }
  </script>
</body>
</html>
