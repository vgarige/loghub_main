<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attendance History - LogHub</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ddd;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #1f1f1f;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }
    header h1 {
      margin: 0;
      font-size: 22px;
      color: #4CAF50;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      background: #1e1e1e;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }
    h2 {
      margin-bottom: 20px;
      text-align: center;
      color: #4CAF50;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    table th, table td {
      padding: 12px;
      border-bottom: 1px solid #333;
      text-align: center;
    }
    table th {
      background: #2a2a2a;
      color: #4CAF50;
    }
    tr:hover {
      background: #2b2b2b;
    }
    .back-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #4CAF50;
      text-decoration: none;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>📅 Attendance History</h1>
    <div>
      <a href="/dashboard" class="btn" style="padding: 8px 15px; background:#333;">⬅ Dashboard</a>
    </div>
  </header>

  <div class="container">
    <h2>Your Attendance Records</h2>
    {% if records %}
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          {% for record in records %}
          <tr>
            <td>{{ record[0] }}</td>
            <td>{{ record[1] }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p style="text-align:center; color:#bbb;">No attendance records found.</p>
    {% endif %}
    <a href="/dashboard" class="back-link">⬅ Back to Dashboard</a>
  </div>
</body>
</html>
